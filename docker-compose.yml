x-backend-environment: &backend-environment
  APP_NAME: Harmonika
  APP_ENV: local
  APP_DEBUG: "true"
  APP_URL: http://localhost:8000
  APP_TIMEZONE: America/Sao_Paulo
  FRONTEND_URL: http://localhost:5173
  CORS_ALLOWED_ORIGINS: http://localhost:5173
  SANCTUM_STATEFUL_DOMAINS: localhost:5173,localhost:8000,127.0.0.1:5173,127.0.0.1:8000
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: harmonika
  DB_USERNAME: harmonika
  DB_PASSWORD: harmonika
  SESSION_DRIVER: database
  CACHE_STORE: redis
  CACHE_PREFIX: harmonika-cache-
  QUEUE_CONNECTION: redis
  REDIS_HOST: redis
  REDIS_PREFIX: harmonika-database-
  REDIS_QUEUE_RETRY_AFTER: 1200
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: 1025
  MAIL_FROM_ADDRESS: financeiro@harmonika.local
  MAIL_FROM_NAME: Harmonika

services:
  backend:
    build:
      context: ./backend
    container_name: harmonika_backend
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      <<: *backend-environment

  queue:
    build:
      context: ./backend
    container_name: harmonika_queue
    working_dir: /var/www
    command: php artisan queue:work redis --queue=reminders,period-closings --sleep=3 --timeout=900 --max-time=3600
    restart: unless-stopped
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      <<: *backend-environment

  scheduler:
    build:
      context: ./backend
    container_name: harmonika_scheduler
    working_dir: /var/www
    command: php artisan schedule:work
    restart: unless-stopped
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      <<: *backend-environment

  frontend:
    build:
      context: ./frontend
    container_name: harmonika_frontend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

  postgres:
    image: postgres:17-alpine
    container_name: harmonika_postgres
    environment:
      POSTGRES_DB: harmonika
      POSTGRES_USER: harmonika
      POSTGRES_PASSWORD: harmonika
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harmonika -d harmonika"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: harmonika_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    container_name: harmonika_mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  backend_vendor:
  frontend_node_modules:
  redis_data:
